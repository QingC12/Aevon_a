name: Reproduce 2.0.33 base

# One-shot: prove that baking the build-time binary patches into a fixed base
# is byte-for-byte lossless. Runs baseline, freeze and release builds in a
# single job so only one macOS runner is allocated.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproduce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 工具链信息
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 -V
          echo "ncpu=$(sysctl -n hw.ncpu)"

      - name: 基线构建（原始补丁流水线）
        run: |
          python3 build.py | tee baseline-manifest.json
          mv build build-baseline
          ls -l build-baseline/*.deb

      - name: 冻结基座
        env:
          STHENO_FREEZE: "1"
        run: |
          python3 build.py | tee freeze-report.json
          mv build build-freeze
          ls -l inputs/base-patched.deb inputs/Orion-private.arm64e inputs/base-patched.json core-native-stubs.S

      - name: 精简构建（仅用冻结基座）
        run: |
          python3 build_release.py | tee release-manifest.json
          ls -l build/*.deb

      - name: 比对哈希
        run: |
          python3 - << 'PY'
          import hashlib, json, pathlib
          ARCHIVE = 'fae44c589c822a4ea9aaf5b941f5330d10c8f1e29d7ccf819305085faf92318d'
          def load(p):
              return json.loads(pathlib.Path(p).read_text())
          base = load('build-baseline/build-manifest.json')
          rel = load('build/build-manifest.json')
          frozen = load('inputs/base-patched.json')
          report = {
              'archive_sha256': ARCHIVE,
              'baseline_sha256': base['sha256'],
              'release_sha256': rel['sha256'],
              'baseline_size': base['size'],
              'release_size': rel['size'],
              'frozen_base_sha256': frozen['frozen_deb_sha256'],
              'frozen_base_bytes': frozen['frozen_deb_bytes'],
              'frozen_core_sha256': frozen['core_sha256'],
              'baseline_data_tar_sha256': base['data_tar_uncompressed_sha256'],
              'release_data_tar_sha256': rel['data_tar_uncompressed_sha256'],
              'baseline_matches_archive': base['sha256'] == ARCHIVE,
              'release_matches_baseline': rel['sha256'] == base['sha256'],
              'release_data_tar_matches_baseline':
                  rel['data_tar_uncompressed_sha256'] == base['data_tar_uncompressed_sha256'],
          }
          pathlib.Path('compare.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          if not report['release_matches_baseline']:
              print('::error::固化基座重建后与基线不一致，重构不等价')
              raise SystemExit(1)
          if not report['baseline_matches_archive']:
              print('::warning::基线未复现归档哈希，判定为工具链版本差异，需人工复核')
          PY

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stheno-2.0.33-reproduce
          compression-level: 1
          if-no-files-found: warn
          path: |
            build/*.deb
            build/build-manifest.json
            build-baseline/*.deb
            build-baseline/build-manifest.json
            inputs/base-patched.deb
            inputs/base-patched.json
            inputs/Orion-private.arm64e
            core-native-stubs.S
            compare.json
            freeze-report.json
