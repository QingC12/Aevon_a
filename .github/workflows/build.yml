# Build produces Actions artifacts only. It never creates a Release or a Tag.
# permissions stays at contents: read so no ref write or publish step can run.
name: Build arm64e gesture test
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check Python source syntax before runtime tests
        run: |
          python3 -c "import ast,pathlib; files=list(pathlib.Path('.').glob('*.py'))+list(pathlib.Path('tests').glob('*.py')); [ast.parse(p.read_text(),filename=str(p)) for p in files]; print('Python syntax:',len(files),'files checked')"
      - name: Test production yellow-zone routing
        run: |
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter test_gesture_routing.m -framework Foundation -framework CoreGraphics -framework QuartzCore -o /tmp/stheno-gesture-routing
          /tmp/stheno-gesture-routing
      - name: Test rebuilt viewport geometry and atomic transport
        run: |
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_viewport_geometry.c -lm -o /tmp/stheno-viewport-math
          /tmp/stheno-viewport-math
          python3 tests/test_device32_authority.py
          python3 tests/test_scene_reflow_contract.py
          xcrun --sdk macosx clang -fobjc-arc -DSTH_VIEWPORT_BUS_TEST -Wall -Wextra -Werror test_viewport_bus.m ViewportBus.m -framework Foundation -o /tmp/stheno-viewport-bus
          /tmp/stheno-viewport-bus
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Werror test_viewport_bus.m ViewportBus.m -framework Foundation -o /tmp/stheno-viewport-process
          /tmp/stheno-viewport-process
      - name: Test application startup scope and cached reflow runtime
        run: |
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter test_viewport_startup.m ViewportStartup.m -framework Foundation -o /tmp/stheno-startup
          /tmp/stheno-startup
          python3 tests/test_scene_reflow_red.py
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter test_scene_reflow_runtime.m -framework Foundation -framework CoreGraphics -framework QuartzCore -o /tmp/stheno-scene-runtime
          /tmp/stheno-scene-runtime
      - name: Test new viewport ownership and original-transaction lifecycle
        run: |
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter test_viewport_host.m -framework Foundation -framework CoreGraphics -o /tmp/stheno-viewport-host
          /tmp/stheno-viewport-host
          /tmp/stheno-viewport-host --delayed-opening
          /tmp/stheno-viewport-host --delayed-shorter
          xcrun --sdk macosx clang -fobjc-arc -DSTH_SCREEN_AWAKE_TEST -Wall -Wextra -Werror test_screen_awake.m -framework Foundation -o /tmp/stheno-screen-awake
          /tmp/stheno-screen-awake
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter test_viewport_client.m -framework Foundation -framework CoreGraphics -o /tmp/stheno-viewport-client
          /tmp/stheno-viewport-client
          python3 tests/test_viewport_contract.py
          python3 tests/test_keyboard_alignment_contract.py
          python3 tests/test_log_completeness.py
      - name: Fetch pre-fix source for exact delayed-callback negative control
        run: git fetch --no-tags --depth=1 origin 93c9c8006980403d6015133a40cfd7bb490189ad
      - name: Require exact original delayed callbacks to violate the transaction guard
        run: python3 tests/test_original_host_negative.py
      - name: Test default size only on first presentation
        run: |
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter test_default_size.m -framework Foundation -o /tmp/stheno-default-size
          /tmp/stheno-default-size
      - name: Test system-action native picker, ordering, and frozen runtime
        run: |
          python3 tests/test_frozen_runtime.py
          python3 tests/test_system_action_contract.py
          for name in catalog gate order; do
            xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_system_action_${name}.c -o /tmp/stheno-system-${name}
            /tmp/stheno-system-${name}
          done
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Werror test_system_action_picker.m SystemActionPicker.m -framework Foundation -o /tmp/stheno-system-picker
          /tmp/stheno-system-picker
      - name: Test system screenshot and recording backend with mock APIs
        run: |
          xcrun --sdk macosx clang -fobjc-arc -DSTH_CAPTURE_TEST -Wall -Wextra -Werror test_system_capture.m SystemCapture.m -framework Foundation -o /tmp/stheno-system-capture
          /tmp/stheno-system-capture
      - name: Test colored icon assets and int or wide factory signatures
        run: |
          python3 tests/test_icon_assets.py
          xcrun --sdk macosx clang -fobjc-arc -DSTH_ICON_HOOK_TEST -Wall -Wextra -Werror test_icon_hooks.m SystemActionHooks.m -framework Foundation -o /tmp/stheno-icon-hooks
          /tmp/stheno-icon-hooks
      - name: Test center chooser filtering, ownership and native launch seams
        run: |
          xcrun --sdk macosx clang -fobjc-arc -DSTH_CHOOSER_TEST -Wall -Wextra -Werror test_chooser_catalog.m ChooserCatalog.m -framework Foundation -o /tmp/stheno-chooser-catalog
          /tmp/stheno-chooser-catalog
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_chooser_motion.c -o /tmp/stheno-chooser-motion
          /tmp/stheno-chooser-motion
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_dock_orientation.c -o /tmp/stheno-dock-orientation
          python3 tests/test_dock_orientation_contract.py
          /tmp/stheno-dock-orientation
          xcrun swiftc -D STH_DOCK_TEST DockQueue.swift test_dock_queue.swift -o /tmp/stheno-dock-queue
          /tmp/stheno-dock-queue
          xcrun swiftc ChooserSearch.swift test_chooser_search.swift -o /tmp/stheno-chooser-search
          /tmp/stheno-chooser-search
          xcrun --sdk macosx clang -fobjc-arc -DSTH_CHOOSER_TEST -DSTH_CHOOSER_SEARCH_TEST -c test_chooser_catalog.m -o /tmp/stheno-search-fixture.o
          xcrun --sdk macosx clang -fobjc-arc -DSTH_CHOOSER_TEST -c ChooserCatalog.m -o /tmp/stheno-search-catalog.o
          xcrun swiftc -import-objc-header test_chooser_search_catalog.h ChooserSearch.swift test_chooser_search_catalog.swift /tmp/stheno-search-fixture.o /tmp/stheno-search-catalog.o -framework Foundation -o /tmp/stheno-search-integration
          /tmp/stheno-search-integration
          xcrun swiftc ChooserFocusPolicy.swift test_chooser_focus.swift -o /tmp/stheno-chooser-focus
          /tmp/stheno-chooser-focus
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter test_chooser_focus_routing.m -framework Foundation -o /tmp/stheno-chooser-shell
          /tmp/stheno-chooser-shell
          xcrun swiftc CenterGlyphGeometry.swift test_center_glyph_geometry.swift -o /tmp/stheno-center-glyph-geometry
          /tmp/stheno-center-glyph-geometry
          python3 tests/test_global_logic_contract.py
          python3 tests/test_update18_contract.py
          python3 tests/test_chooser_contract.py
          python3 tests/test_chooser_runtime.py --require-native --include-scenes
          python3 tests/test_chooser_ui.py --require-native
          python3 tests/test_native_stub_abi.py --self-test
          python3 tests/test_installer_preferences.py
      - name: Test safe preference seeding and installer lifecycle
        run: python3 tests/test_installer_lifecycle.py
      - name: Test release survives native collapse and transient system visibility restores
        run: |
          xcrun swiftc CenterSelection.swift test_center_selection.swift -o /tmp/stheno-center-selection
          /tmp/stheno-center-selection
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_visibility_policy.c -o /tmp/stheno-visibility-policy
          /tmp/stheno-visibility-policy
          python3 tests/test_update19_contract.py
      - name: Verify frozen base integrity and private Orion isolation
        run: python3 tests/test_frozen_base.py
      - name: Verify ring icon plate keeps its light-mode contrast
        run: python3 tests/test_icon_pad.py
      - name: Build and verify arm64e binaries and Debian archive
        run: python3 build.py
      - name: Verify dynamic C callbacks are exported by the real Swift library
        run: python3 tests/test_runtime_exports.py
      - name: Verify real ARM64e Published ownership and register ABI
        run: python3 tests/test_published_bridge_abi.py
      - name: Verify fresh native catalog enumeration and partial ownership
        run: python3 tests/test_chooser_catalog_abi.py
      - name: Verify legacy keyboard removal and original native animation ABI
        run: python3 tests/test_viewport_abi.py
      - name: Verify final native stub targets and in-memory negative controls
        run: python3 tests/test_native_stub_abi.py
      - name: Verify original code, complete callback surface and lossless resources
        run: python3 tests/test_runtime_package.py
      - name: Verify settings, source cleanup, and byte-identical archive payload
        run: python3 tests/test_maintenance_contract.py
      - name: Verify clean-install layout, parent directory entries, and preinst
        run: python3 tests/test_install_layout.py
      - name: Verify artifact deployment, provenance, diagnostics and signature pages
        run: python3 tests/test_artifact_policy.py
      - uses: actions/upload-artifact@v4
        with:
          name: Stheno-arm64e-RootHide-Gestures-test
          compression-level: 1
          path: |
            build/*.deb
            build/build-manifest.json
          if-no-files-found: error
          retention-days: 7
