name: Build arm64e gesture test
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify arm64e binaries and Debian archive
        run: python3 build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Stheno-arm64e-RootHide-Gestures-test
          path: |
            build/*.deb
            build/build-manifest.json
          if-no-files-found: error
          retention-days: 7
