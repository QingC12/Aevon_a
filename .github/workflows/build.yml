name: Build arm64e gesture test
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test production yellow-zone routing
        run: |
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter test_gesture_routing.m -framework Foundation -framework CoreGraphics -framework QuartzCore -o /tmp/stheno-gesture-routing
          /tmp/stheno-gesture-routing
      - name: Test keyboard geometry and production lifecycle
        run: |
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra test_keyboard_geometry.c -o /tmp/stheno-keyboard-geometry
          /tmp/stheno-keyboard-geometry
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter test_keyboard_routing.m -framework Foundation -framework CoreGraphics -framework QuartzCore -o /tmp/stheno-keyboard-routing
          /tmp/stheno-keyboard-routing
      - name: Test editor visibility and keyboard lifecycle
        run: |
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_editor_visibility.c -o /tmp/stheno-editor-visibility
          /tmp/stheno-editor-visibility
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_editor_lifecycle.c -o /tmp/stheno-editor-lifecycle
          /tmp/stheno-editor-lifecycle
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_keyboard_coordinates.c -o /tmp/stheno-keyboard-coordinates
          /tmp/stheno-keyboard-coordinates
      - name: Test focused refinements without changing QQ and Minis
        run: |
          python3 test_editor_refined_contract.py
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_editor_refinement.c -o /tmp/stheno-editor-refinement
          /tmp/stheno-editor-refinement
      - name: Test complete composer ownership and preserve normal WeChat route
        run: |
          python3 test_editor_composite_contract.py
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_editor_composite.c -o /tmp/stheno-editor-composite
          /tmp/stheno-editor-composite
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_keyboard_plane.c -o /tmp/stheno-keyboard-plane
          /tmp/stheno-keyboard-plane
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter test_composite_layout.m -framework Foundation -framework CoreGraphics -o /tmp/stheno-composite-layout
          /tmp/stheno-composite-layout
      - name: Test scene-only keyboard contract and session cache
        run: |
          python3 test_keyboard_contract.py
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_keyboard_session.c -o /tmp/stheno-keyboard-session
          /tmp/stheno-keyboard-session
      - name: Replay rapid keyboard cycles and immutable observer delivery
        run: |
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_layout_settle.c -o /tmp/stheno-layout-settle
          /tmp/stheno-layout-settle
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter test_keyboard_delivery.m -framework Foundation -o /tmp/stheno-keyboard-delivery
          /tmp/stheno-keyboard-delivery
      - name: Test physical card mapping and cross-process geometry transport
        run: |
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_layout_math.c -o /tmp/stheno-layout-math
          /tmp/stheno-layout-math
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter test_layout_bus.m LayoutBus.m -framework Foundation -framework QuartzCore -framework CoreGraphics -o /tmp/stheno-layout-bus
          /tmp/stheno-layout-bus
      - name: Test default size only on first presentation
        run: |
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter test_default_size.m -framework Foundation -o /tmp/stheno-default-size
          /tmp/stheno-default-size
      - name: Test system-action native picker, ordering, and frozen runtime
        run: |
          python3 test_frozen_runtime.py
          python3 test_system_action_contract.py
          for name in catalog gate order; do
            xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_system_action_${name}.c -o /tmp/stheno-system-${name}
            /tmp/stheno-system-${name}
          done
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Werror test_system_action_picker.m SystemActionPicker.m -framework Foundation -o /tmp/stheno-system-picker
          /tmp/stheno-system-picker
      - name: Test system screenshot and recording backend with mock APIs
        run: |
          xcrun --sdk macosx clang -fobjc-arc -DSTH_CAPTURE_TEST -Wall -Wextra -Werror test_system_capture.m SystemCapture.m -framework Foundation -o /tmp/stheno-system-capture
          /tmp/stheno-system-capture
      - name: Test colored icon assets and int or wide factory signatures
        run: |
          python3 test_icon_assets.py
          xcrun --sdk macosx clang -fobjc-arc -DSTH_ICON_HOOK_TEST -Wall -Wextra -Werror test_icon_hooks.m SystemActionHooks.m -framework Foundation -o /tmp/stheno-icon-hooks
          /tmp/stheno-icon-hooks
      - name: Test center chooser filtering, ownership and native launch seams
        run: |
          xcrun --sdk macosx clang -fobjc-arc -DSTH_CHOOSER_TEST -Wall -Wextra -Werror test_chooser_catalog.m ChooserCatalog.m -framework Foundation -o /tmp/stheno-chooser-catalog
          /tmp/stheno-chooser-catalog
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_chooser_motion.c -o /tmp/stheno-chooser-motion
          /tmp/stheno-chooser-motion
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_dock_orientation.c -o /tmp/stheno-dock-orientation
          /tmp/stheno-dock-orientation
          xcrun swiftc -D STH_DOCK_TEST DockQueue.swift test_dock_queue.swift -o /tmp/stheno-dock-queue
          /tmp/stheno-dock-queue
          python3 test_update18_contract.py
          python3 test_chooser_contract.py
          python3 test_installer_preferences.py
      - name: Test release survives native collapse and transient system visibility restores
        run: |
          xcrun swiftc CenterSelection.swift test_center_selection.swift -o /tmp/stheno-center-selection
          /tmp/stheno-center-selection
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_visibility_policy.c -o /tmp/stheno-visibility-policy
          /tmp/stheno-visibility-policy
          python3 test_update19_contract.py
      - name: Verify private Orion ABI and isolation
        run: python3 test_embed_orion.py
      - name: Build and verify arm64e binaries and Debian archive
        run: python3 build.py
      - name: Verify dynamic C callbacks are exported by the real Swift library
        run: python3 test_runtime_exports.py
      - name: Verify settings, source cleanup, and byte-identical archive payload
        run: python3 test_maintenance_contract.py
      - uses: actions/upload-artifact@v4
        with:
          name: Stheno-arm64e-RootHide-Gestures-test
          path: |
            build/*.deb
            build/build-manifest.json
          if-no-files-found: error
          retention-days: 7
