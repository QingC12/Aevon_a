name: Build arm64e gesture test
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test production yellow-zone routing
        run: |
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter test_gesture_routing.m -framework Foundation -framework CoreGraphics -framework QuartzCore -o /tmp/stheno-gesture-routing
          /tmp/stheno-gesture-routing
      - name: Test keyboard geometry and production lifecycle
        run: |
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra test_keyboard_geometry.c -o /tmp/stheno-keyboard-geometry
          /tmp/stheno-keyboard-geometry
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter test_keyboard_routing.m -framework Foundation -framework CoreGraphics -framework QuartzCore -o /tmp/stheno-keyboard-routing
          /tmp/stheno-keyboard-routing
      - name: Test keyboard gap correction fallbacks
        run: |
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_keyboard_inset.c -o /tmp/stheno-keyboard-inset
          /tmp/stheno-keyboard-inset
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_editor_visibility.c -o /tmp/stheno-editor-visibility
          /tmp/stheno-editor-visibility
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_keyboard_coordinates.c -o /tmp/stheno-keyboard-coordinates
          /tmp/stheno-keyboard-coordinates
      - name: Test scene-only keyboard contract and session cache
        run: |
          python3 test_keyboard_contract.py
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_keyboard_session.c -o /tmp/stheno-keyboard-session
          /tmp/stheno-keyboard-session
      - name: Replay rapid keyboard cycles and immutable observer delivery
        run: |
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_layout_settle.c -o /tmp/stheno-layout-settle
          /tmp/stheno-layout-settle
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter test_keyboard_delivery.m -framework Foundation -o /tmp/stheno-keyboard-delivery
          /tmp/stheno-keyboard-delivery
      - name: Test physical card mapping and cross-process geometry transport
        run: |
          xcrun --sdk macosx clang -std=c11 -Wall -Wextra -Werror test_layout_math.c -o /tmp/stheno-layout-math
          /tmp/stheno-layout-math
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter test_layout_bus.m LayoutBus.m -framework Foundation -framework QuartzCore -framework CoreGraphics -o /tmp/stheno-layout-bus
          /tmp/stheno-layout-bus
      - name: Test default size only on first presentation
        run: |
          xcrun --sdk macosx clang -fobjc-arc -Wall -Wextra -Wno-unused-parameter test_default_size.m -framework Foundation -o /tmp/stheno-default-size
          /tmp/stheno-default-size
      - name: Verify private Orion ABI and isolation
        run: python3 test_embed_orion.py
      - name: Build and verify arm64e binaries and Debian archive
        run: python3 build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Stheno-arm64e-RootHide-Gestures-test
          path: |
            build/*.deb
            build/build-manifest.json
          if-no-files-found: error
          retention-days: 7
